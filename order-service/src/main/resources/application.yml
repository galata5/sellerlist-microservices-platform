server:
  port: 8300
  servlet:
    context-path: /order-service

spring:
  application:
    name: ORDER-SERVICE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      maximum-pool-size: 15
      minimum-idle: 5
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://product-service:8500/product-service}
  outbox:
    publisher-fixed-delay-ms: 5000

security:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
    catalog-service-secret: ${PRODUCT_SERVICE_INTERNAL_AUTH_SECRET}
    expected-issuer: ${INTERNAL_AUTH_EXPECTED_ISSUER}

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        automatic-transition-from-open-to-half-open-enabled: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
        sliding-window-type: COUNT_BASED

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.sellerlist.app: INFO
