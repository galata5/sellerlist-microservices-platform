apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  labels:
    app: order-service
data:
  SPRING_APPLICATION_NAME: ORDER-SERVICE
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.example.internal:3306/order_service?useSSL=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: order_service
  INTERNAL_AUTH_EXPECTED_ISSUER: API-GATEWAY
  CATALOG_BASE_URL: http://product-service:8500/product-service
  RABBITMQ_HOST: rabbitmq.example.internal
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: order_service
  SPRING_FLYWAY_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  labels:
    app: order-service
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: change-me
  INTERNAL_SERVICE_SECRET: change-me
  PRODUCT_SERVICE_INTERNAL_AUTH_SECRET: change-me
  RABBITMQ_PASSWORD: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    monitoring: enabled
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8300
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        monitoring: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: ghcr.io/your-org/order-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8300
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /order-service/actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /order-service/actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /order-service/actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
---
apiVersion: batch/v1
kind: Job
metadata:
  name: order-service-migration
  labels:
    app: order-service
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: order-service-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/your-org/order-service:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -jar
            - app.jar
            - --spring.main.web-application-type=none
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
