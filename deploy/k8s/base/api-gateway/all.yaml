apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  labels:
    app: api-gateway
data:
  USER_SERVICE_BASE_URL: http://user-service:8700
  PRODUCT_SERVICE_BASE_URL: http://product-service:8500
  ORDER_SERVICE_BASE_URL: http://order-service:8300
  PAYMENT_SERVICE_BASE_URL: http://payment-service:8400
  SHIPPING_SERVICE_BASE_URL: http://shipping-service:8600
  FAVOURITE_SERVICE_BASE_URL: http://favourite-service:8800
  CORS_ALLOWED_ORIGINS: https://app.example.com
  SECURE_COOKIES: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  labels:
    app: api-gateway
type: Opaque
stringData:
  JWT_SECRET: change-me
  USER_SERVICE_INTERNAL_AUTH_SECRET: change-me
  PRODUCT_SERVICE_INTERNAL_AUTH_SECRET: change-me
  ORDER_SERVICE_INTERNAL_AUTH_SECRET: change-me
  PAYMENT_SERVICE_INTERNAL_AUTH_SECRET: change-me
  SHIPPING_SERVICE_INTERNAL_AUTH_SECRET: change-me
  FAVOURITE_SERVICE_INTERNAL_AUTH_SECRET: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    monitoring: enabled
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        monitoring: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/api-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 600m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
