apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: frontend
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: frontend
  podMetricsEndpoints:
    - port: http
      path: /healthz
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: api-gateway
      monitoring: enabled
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: user-service
      monitoring: enabled
  endpoints:
    - port: http
      path: /user-service/actuator/prometheus
      interval: 30s
---
