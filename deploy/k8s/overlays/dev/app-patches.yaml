apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          startupProbe:
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  template:
    spec:
      initContainers:
        - name: wait-for-user-service
          image: busybox:1.36
          command:
            - sh
            - -lc
            - until nc -z user-service 8700; do sleep 5; done
      containers:
        - name: api-gateway
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  template:
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -lc
            - until nc -z mysql 3306; do sleep 5; done
        - name: wait-for-user-schema
          image: mysql:8.0
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: dev-local-infra
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -lc
            - until mysql -hmysql -uroot -D user_service -e "SHOW TABLES LIKE 'address';" | grep -q address; do sleep 5; done
      containers:
        - name: user-service
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 3
---
