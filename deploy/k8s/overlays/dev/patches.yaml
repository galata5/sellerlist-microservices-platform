apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce
spec:
  tls:
    - hosts:
        - e-shope.me
      secretName: ecommerce-dev-tls
  rules:
    - host: e-shope.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  CORS_ALLOWED_ORIGINS: https://e-shope.me,http://127.0.0.1:3000,http://localhost:3000
  SECURE_COOKIES: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
stringData:
  JWT_SECRET: replace-with-a-32-character-jwt-secret
  USER_SERVICE_INTERNAL_AUTH_SECRET: replace-with-a-unique-user-service-secret
  PRODUCT_SERVICE_INTERNAL_AUTH_SECRET: replace-with-a-unique-product-service-secret
  ORDER_SERVICE_INTERNAL_AUTH_SECRET: replace-with-a-unique-order-service-secret
  PAYMENT_SERVICE_INTERNAL_AUTH_SECRET: replace-with-a-unique-payment-service-secret
  SHIPPING_SERVICE_INTERNAL_AUTH_SECRET: replace-with-a-unique-shipping-service-secret
  FAVOURITE_SERVICE_INTERNAL_AUTH_SECRET: replace-with-a-unique-favourite-service-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: root
---
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
stringData:
  SPRING_DATASOURCE_PASSWORD: replace-with-a-local-mysql-root-password
  INTERNAL_SERVICE_SECRET: replace-with-a-unique-user-service-secret
---
apiVersion: v1
