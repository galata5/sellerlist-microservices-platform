apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce
spec:
  tls:
    - hosts:
        - app.example.com
      secretName: ecommerce-prod-tls
  rules:
    - host: app.example.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  CORS_ALLOWED_ORIGINS: https://app.example.com
  SECURE_COOKIES: "true"
