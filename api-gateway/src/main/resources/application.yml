server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: "${CORS_ALLOWED_ORIGINS}"
            allowed-headers: '*'
            exposed-headers: '*'
            allow-credentials: true
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
      routes:
        - id: USER-SERVICE
          uri: ${USER_SERVICE_BASE_URL}
          predicates:
            - Path=/api/users/**,/api/credentials/**,/api/address/**,/api/verificationTokens/**
          filters:
            - PrefixPath=/user-service
        - id: PRODUCT-SERVICE
          uri: ${PRODUCT_SERVICE_BASE_URL}
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - PrefixPath=/product-service
        - id: ORDER-SERVICE
          uri: ${ORDER_SERVICE_BASE_URL}
          predicates:
            - Path=/api/orders/**,/api/carts/**
          filters:
            - PrefixPath=/order-service
        - id: PAYMENT-SERVICE
          uri: ${PAYMENT_SERVICE_BASE_URL}
          predicates:
            - Path=/api/payments/**
          filters:
            - PrefixPath=/payment-service
        - id: SHIPPING-SERVICE
          uri: ${SHIPPING_SERVICE_BASE_URL}
          predicates:
            - Path=/api/order-items/**
          filters:
            - PrefixPath=/shipping-service
        - id: FAVOURITE-SERVICE
          uri: ${FAVOURITE_SERVICE_BASE_URL}
          predicates:
            - Path=/api/favourites/**
          filters:
            - PrefixPath=/favourite-service

auth:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL}/user-service

security:
  cookies:
    secure: ${SECURE_COOKIES}
  jwt:
    secret: ${JWT_SECRET}
  internal:
    issuer: ${spring.application.name}
    user-service-secret: ${USER_SERVICE_INTERNAL_AUTH_SECRET}
    product-service-secret: ${PRODUCT_SERVICE_INTERNAL_AUTH_SECRET}
    order-service-secret: ${ORDER_SERVICE_INTERNAL_AUTH_SECRET}
    payment-service-secret: ${PAYMENT_SERVICE_INTERNAL_AUTH_SECRET}
    shipping-service-secret: ${SHIPPING_SERVICE_INTERNAL_AUTH_SECRET}
    favourite-service-secret: ${FAVOURITE_SERVICE_INTERNAL_AUTH_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      apiGateway:
        register-health-indicator: true
        event-consumer-buffer-size: 10
        automatic-transition-from-open-to-half-open-enabled: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 5s
        sliding-window-type: COUNT_BASED

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.sellerlist.app: INFO
